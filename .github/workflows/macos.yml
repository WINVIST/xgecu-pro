name: macOS arm64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          rustc --version
          rustup target add aarch64-apple-darwin

      - name: Test Rust workspace
        working-directory: minipro-rs
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo fmt --all -- --check

      - name: Test hex buffer core
        working-directory: mac-app
        run: swift test

      - name: Build macOS app
        run: |
          xcodebuild -project mac-app/XGecuPro.xcodeproj \
            -scheme XGecuPro -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/xgecu-pro-derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Check app and bundled helper
        run: |
          app="$RUNNER_TEMP/xgecu-pro-derived/Build/Products/Release/XGecuPro.app"
          test "$(uname -m)" = arm64
          test -x "$app/Contents/MacOS/XGecuPro"
          test -x "$app/Contents/Resources/minipro"
          test "$(lipo -archs "$app/Contents/MacOS/XGecuPro")" = arm64
          test "$(lipo -archs "$app/Contents/Resources/minipro")" = arm64
          "$app/Contents/Resources/minipro" --version

      - name: Package unsigned macOS app
        if: github.ref == 'refs/heads/main'
        run: |
          app="$RUNNER_TEMP/xgecu-pro-derived/Build/Products/Release/XGecuPro.app"
          archive="$RUNNER_TEMP/XGecuPro-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          unzip -t "$archive"
          mkdir "$RUNNER_TEMP/repacked"
          ditto -x -k "$archive" "$RUNNER_TEMP/repacked"
          test -x "$RUNNER_TEMP/repacked/XGecuPro.app/Contents/MacOS/XGecuPro"
          test -x "$RUNNER_TEMP/repacked/XGecuPro.app/Contents/Resources/minipro"
          "$RUNNER_TEMP/repacked/XGecuPro.app/Contents/Resources/minipro" --version
          (cd "$RUNNER_TEMP" && shasum -a 256 XGecuPro-macOS-arm64.zip > XGecuPro-macOS-arm64.zip.sha256)

      - name: Upload installable app
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XGecuPro-macOS-arm64-unsigned
          path: |
            ${{ runner.temp }}/XGecuPro-macOS-arm64.zip
            ${{ runner.temp }}/XGecuPro-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30
