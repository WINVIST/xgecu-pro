<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#edf1f6"/>
    </linearGradient>
    <radialGradient id="wash">
      <stop stop-color="#d9eaff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#eaf2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="540" fill="url(#paper)"/>
  <ellipse cx="190" cy="240" rx="160" ry="130" fill="url(#wash)"/>
  <ellipse cx="530" cy="240" rx="160" ry="130" fill="url(#wash)"/>
  <path d="M48 45h28" stroke="#087ee3" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="86" font-size="28" font-weight="700" letter-spacing="-.6" fill="#1c2939">XGecu Pro</text>
    <text x="48" y="116" font-size="16" fill="#4e6074">Drag the app to Applications to install.</text>
    <text x="672" y="61" text-anchor="end" font-size="12" fill="#536579">Apple Silicon</text>
    <text x="672" y="80" text-anchor="end" font-size="12" fill="#536579">macOS 26 or later</text>
    <text x="360" y="219" text-anchor="middle" font-size="12" fill="#536579">Drag to install</text>
    <text x="48" y="384" font-size="14" font-weight="700" fill="#1c2939">First launch</text>
    <text x="672" y="384" text-anchor="end" font-size="12" fill="#536579">Ad hoc signed · Not notarized</text>
    <text x="48" y="406" font-size="12" fill="#4e6074">If macOS blocks launch, verify the download checksum, then run:</text>
    <text x="48" y="509" font-size="11.5" fill="#536579">Copyable commands: XGecuPro-First-Launch.txt in the GitHub release.</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#1c2939">
    <text x="48" y="435">codesign --verify --deep --strict /Applications/XGecuPro.app &amp;&amp;</text>
    <text x="48" y="458">xattr -dr com.apple.quarantine /Applications/XGecuPro.app &amp;&amp;</text>
    <text x="48" y="481">open /Applications/XGecuPro.app</text>
  </g>
  <path d="M302 240h110m-11-11 11 11-11 11" fill="none" stroke="#087ee3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 352h624" stroke="#d6dfe9"/>
</svg>
